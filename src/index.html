<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google AI Limit Monitor</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="gadget-container">
      <!-- タイトルバー領域（ドラッグ可能領域） -->
      <header class="gadget-header" data-tauri-drag-region>
        <div class="brand-group" data-tauri-drag-region>
          <div id="status-dot" class="status-dot disconnected" title="未接続"></div>
          <span class="app-title" data-tauri-drag-region>Google AI Limits</span>
          <span id="plan-badge" class="plan-badge" data-tauri-drag-region>--</span>
        </div>
        <div class="window-controls">
          <button id="btn-refresh" class="icon-btn" title="今すぐ更新">
            <svg viewBox="0 0 24 24" width="13" height="13">
              <path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
          <button id="btn-minimize" class="icon-btn" title="最小化">
            <svg viewBox="0 0 24 24" width="13" height="13">
              <path fill="currentColor" d="M19 13H5v-2h14v2z"/>
            </svg>
          </button>
          <button id="btn-close" class="icon-btn btn-close" title="閉じる">
            <svg viewBox="0 0 24 24" width="13" height="13">
              <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- メインメーター -->
      <main class="meters-container">
        <!-- 5-Hour Limit メーター -->
        <div class="meter-card">
          <div class="gauge-wrapper">
            <svg class="progress-ring" width="88" height="88">
              <circle class="ring-bg" cx="44" cy="44" r="36" />
              <circle id="ring-5h" class="ring-val" cx="44" cy="44" r="36" />
            </svg>
            <div class="gauge-center">
              <span id="val-5h" class="gauge-percent">--%</span>
            </div>
          </div>
          <div class="meter-meta">
            <div class="meter-title">5-Hour Limit</div>
            <div id="reset-5h" class="meter-reset">リセット: --</div>
            <div id="model-5h" class="meter-model">待機中</div>
          </div>
        </div>

        <!-- Weekly Limit メーター -->
        <div class="meter-card">
          <div class="gauge-wrapper">
            <svg class="progress-ring" width="88" height="88">
              <circle class="ring-bg" cx="44" cy="44" r="36" />
              <circle id="ring-weekly" class="ring-val" cx="44" cy="44" r="36" />
            </svg>
            <div class="gauge-center">
              <span id="val-weekly" class="gauge-percent">--%</span>
            </div>
          </div>
          <div class="meter-meta">
            <div class="meter-title">Weekly Limit</div>
            <div id="reset-weekly" class="meter-reset">リセット: --</div>
            <div id="model-weekly" class="meter-model">待機中</div>
          </div>
        </div>
      </main>

      <!-- フッター -->
      <footer class="gadget-footer">
        <div class="credit-badge" title="利用可能なPrompt Credits">
          <span class="credit-icon">⚡</span>
          <span id="credit-count">0</span> credits
        </div>
        <div class="footer-time">
          更新: <span id="last-updated">--:--:--</span>
        </div>
      </footer>
    </div>
  </body>
</html>
