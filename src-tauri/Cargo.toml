[package]
name = "google-ai-limit-monitor"
version = "1.0.0"
description = "Desktop gadget for Windows to monitor Google AI (Antigravity/Gemini) 5-Hour and Weekly limits"
authors = ["kusak"]
edition = "2021"

[lib]
name = "google_ai_limit_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
